name: RUUT
description: >-
  RUUT (ruut.mx) is a Mexican fintech and mobile-first investment platform that
  lets everyday people invest in the US stock markets. Marketed as "la plataforma
  de inversion para no inversionistas" (the investment platform for non-investors),
  it gives users access to 8,000+ US stocks and ETFs, personalized risk-based
  portfolios (safe, moderate, aggressive), goal-based investing, and AI-tailored
  market news. Accounts are protected up to $500,000 USD via SIPC insurance
  through its US brokerage partner Alpaca Securities LLC (FINRA/SIPC). RUUT is
  registered with Mexico's CNBV as an independent investment advisor (Folio
  #30174) and is a portfolio company of 500 Global. RUUT is a consumer product
  with no public developer API; this profile was enriched from its public
  website and live domain probes.
